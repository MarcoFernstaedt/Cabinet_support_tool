<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" role="img" aria-labelledby="title description"><title id="title">Cabinet Support Tool: component placement</title><desc id="description">Mashura hosts the support API and its support database. Support consoles and cabinet agents initiate connections to that API. Customer application databases remain on site. Diagram describes placement, not release certification.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#e2e8f0}.sub{font-size:14px;fill:#aebcd0}.name{font-size:19px;font-weight:600}.label{font-size:14px;fill:#cbd5e1}.boundary{fill:none;stroke:#fb7185;stroke-width:1.5;stroke-dasharray:7 5}.flow{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="100%" height="100%" fill="#020617"/><rect width="100%" height="100%" fill="url(#grid)"/><text x="40" y="46" font-size="27" font-weight="600">Cabinet Support Tool: component placement</text><text x="40" y="76" class="sub">Confirmed placement. Transport hardening and lab validation remain release gates.</text><rect class="boundary" x="40" y="110" width="285" height="250" rx="12"/><text x="56" y="137" class="label">Mashura support workstation</text><rect class="boundary" x="365" y="110" width="695" height="250" rx="12"/><text x="381" y="137" class="label">Mashura server infrastructure</text><rect class="boundary" x="40" y="445" width="1020" height="340" rx="12"/><text x="56" y="472" class="label">Customer client: one location shown, repeat for other locations</text><path class="flow" d="M 305 239 L 410 239"/><text x="320" y="220" class="label">HTTPS API</text><path class="flow" d="M 700 239 L 775 239"/><text x="713" y="220" class="label">persist</text><path class="flow" d="M 235 545 L 235 510 L 530 510 L 530 320"/><text x="293" y="397" class="label">Agent initiated telemetry and polling</text><path class="flow" d="M 740 545 L 740 424 L 640 424 L 640 320"/><path class="flow" marker-start="url(#arrow)" d="M 440 640 L 570 640"/><text x="461" y="625" class="label">local app sync</text><rect x="60" y="180" width="245" height="140" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/><text x="78" y="209" class="name">Support console</text><text x="78" y="234" class="sub">Windows WPF</text><text x="78" y="255" class="sub">Identity and diagnostics</text><text x="78" y="276" class="sub">Permitted action requests</text><rect x="410" y="180" width="290" height="140" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/><text x="428" y="209" class="name">Support API</text><text x="428" y="234" class="sub">ASP.NET Core</text><text x="428" y="255" class="sub">Authorization and approvals</text><text x="428" y="276" class="sub">Dispatch and result records</text><rect x="775" y="180" width="260" height="140" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/><text x="793" y="209" class="name">Support database</text><text x="793" y="234" class="sub">PostgreSQL fleet target</text><text x="793" y="255" class="sub">Telemetry and audit records</text><text x="793" y="276" class="sub">Not the dispensing database</text><rect x="70" y="545" width="370" height="165" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/><text x="88" y="574" class="name">Sync cabinet</text><text x="88" y="599" class="sub">Windows support agent</text><text x="88" y="620" class="sub">Dispensing application</text><text x="88" y="641" class="sub">Local application database</text><text x="88" y="662" class="sub">No inbound support listener</text><rect x="570" y="545" width="450" height="165" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/><text x="588" y="574" class="name">Satellite cabinets</text><text x="588" y="599" class="sub">Windows support agent on each cabinet</text><text x="588" y="620" class="sub">Dispensing application uses the sync cabinet</text><text x="588" y="641" class="sub">Independent outbound support connection</text><text x="70" y="750" class="sub">No support path to patient records, biometric templates or physical drawer controls is authorized.</text><text x="40" y="830" class="label">Rose boundaries: separate trust zones. Arrows show initiator or data direction, not a firewall rule.</text><text x="40" y="856" class="sub">The support server is not installed at the customer location. Hosting jurisdiction still needs approval.</text></svg>