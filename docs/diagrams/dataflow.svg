<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="860" viewBox="0 0 1100 860" role="img" aria-labelledby="title description"><title id="title">Cabinet Support Tool: data and authority</title><desc id="description">Support requests are authorized on the Mashura server. Device agents initiate telemetry and action polls. Local safety checks precede permitted effects. Results return through the server. Unique device identity and durable acknowledgement are required hardening, not verified features.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#e2e8f0}.sub{font-size:14px;fill:#aebcd0}.name{font-size:19px;font-weight:600}.label{font-size:14px;fill:#cbd5e1}.boundary{fill:none;stroke:#fb7185;stroke-width:1.5;stroke-dasharray:7 5}.flow{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="100%" height="100%" fill="#020617"/><rect width="100%" height="100%" fill="url(#grid)"/><text x="40" y="46" font-size="27" font-weight="600">Cabinet Support Tool: data and authority</text><text x="40" y="76" class="sub">Current message direction with required safety checks. This is not a claim of production readiness.</text><rect class="boundary" x="35" y="120" width="260" height="570" rx="12"/><text x="51" y="147" class="label">Support workstation</text><rect class="boundary" x="380" y="120" width="320" height="570" rx="12"/><text x="396" y="147" class="label">Mashura control plane</text><rect class="boundary" x="785" y="120" width="280" height="570" rx="12"/><text x="801" y="147" class="label">Customer cabinet</text><path class="flow" d="M 270 245 L 405 245"/><text x="292" y="230" class="label">user session</text><path class="flow" d="M 810 350 L 675 350"/><text x="694" y="335" class="label">device identity</text><path class="flow" d="M 810 435 L 675 435"/><text x="701" y="420" class="label">poll request</text><path class="flow" d="M 675 480 L 810 480"/><text x="698" y="464" class="label">named action</text><path class="flow" d="M 810 575 L 675 575"/><text x="727" y="560" class="label">result</text><path class="flow" d="M 405 575 L 270 575"/><text x="289" y="560" class="label">result and audit</text><rect x="55" y="185" width="215" height="125" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/><text x="73" y="214" class="name">Operator</text><text x="73" y="239" class="sub">Select full cabinet identity</text><text x="73" y="260" class="sub">Reason and ticket</text><text x="73" y="281" class="sub">Confirm requested action</text><rect x="55" y="520" width="215" height="120" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/><text x="73" y="549" class="name">Visible outcome</text><text x="73" y="574" class="sub">Collected timestamp</text><text x="73" y="595" class="sub">Success, refusal or unknown</text><text x="73" y="616" class="sub">No success from HTTP alone</text><rect x="405" y="185" width="270" height="125" rx="8" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/><text x="423" y="214" class="name">Authorize</text><text x="423" y="239" class="sub">Support identity and policy</text><text x="423" y="260" class="sub">Separate approver if required</text><text x="423" y="281" class="sub">Device binding and revocation</text><rect x="405" y="375" width="270" height="115" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/><text x="423" y="404" class="name">Dispatch</text><text x="423" y="429" class="sub">Stable request identity</text><text x="423" y="450" class="sub">Expiry and safety policy</text><text x="423" y="471" class="sub">Durable delivery required</text><rect x="405" y="520" width="270" height="120" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/><text x="423" y="549" class="name">Persist and expose</text><text x="423" y="574" class="sub">Result reconciliation</text><text x="423" y="595" class="sub">Audit separate from payload</text><text x="423" y="616" class="sub">Bounded diagnostic retention</text><rect x="810" y="185" width="230" height="125" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/><text x="828" y="214" class="name">Windows agent</text><text x="828" y="239" class="sub">Outbound requests only</text><text x="828" y="260" class="sub">Typed collectors</text><text x="828" y="281" class="sub">No dispensing DB access</text><rect x="810" y="375" width="230" height="150" rx="8" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/><text x="828" y="404" class="name">Local checks</text><text x="828" y="429" class="sub">Own allowlists</text><text x="828" y="450" class="sub">Current occupancy</text><text x="828" y="471" class="sub">Durable journal before effect</text><text x="828" y="492" class="sub">Rollback on uncertain change</text><text x="40" y="735" class="label">The action response uses the cabinet initiated connection. No inbound cabinet port is required.</text><text x="40" y="766" class="sub">Credentials, raw clinical data and arbitrary commands must not enter diagnostic or audit payloads.</text><text x="40" y="797" class="sub">Device identity, durable delivery, recovery and data retention remain explicit release gates.</text></svg>