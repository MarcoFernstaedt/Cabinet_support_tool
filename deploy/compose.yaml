# Demo deployment: Microsoft SQL Server 2022, the platform server (agent API + console API + console), and Caddy for the console's HTTPS.
# Secrets and names come from deploy/.env (made by setup.sh from .env.example; never committed).
#
#   docker compose up -d --build        start or update (the migrate service runs first, every time)
#   docker compose logs -f server       watch the server
#   docker compose down                 stop (data is kept in the volumes)
#
# Published ports: 80 and 443 (Caddy, the console) and 8443 (the agent API, mutual TLS, terminated by Node).
# SQL Server is never published; it sits on an internal network with no route out.

name: cabinet

x-platform-image: &platform-image
  image: cabinet-platform:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile

services:
  # Microsoft SQL Server 2022 for Linux. MSSQL_PID chooses the edition: Express is free (databases up to 10 GB, 1 GB of memory for the
  # engine) and carries a small deployment; Standard, Enterprise or Developer need a licence you hold. Accepting the EULA is your decision.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    restart: unless-stopped
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:?set ACCEPT_EULA=Y in deploy/.env to accept the SQL Server licence terms}
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?set SQL_SA_PASSWORD in deploy/.env}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
    volumes:
      - mssqldata:/var/opt/mssql
    networks:
      - backend
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # One shot: creates the database, applies the migrations as the database owner, then creates or updates the application's
  # least-privilege login (cabinet_app_login, a member of cabinet_app only). Safe to run again.
  migrate:
    <<: *platform-image
    restart: "no"
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      DATABASE_OWNER_URL: sqlserver://sa:${SQL_SA_PASSWORD}@mssql:1433/cabinet?trustServerCertificate=true
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/.env}
    command: ["sh", "-c", "node /opt/cabinet/deploy/database-setup.mjs create && node /opt/cabinet/server/dist/src/cli.js migrate && node /opt/cabinet/deploy/database-setup.mjs login"]
    networks:
      - backend
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  server:
    <<: *platform-image
    restart: unless-stopped
    depends_on:
      mssql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: sqlserver://cabinet_app_login:${APP_DB_PASSWORD}@mssql:1433/cabinet?trustServerCertificate=true
      # Every name or IP an agent may use to reach the agent API. The development TLS certificate covers exactly these.
      AGENT_API_HOSTNAMES: ${AGENT_API_HOSTNAMES:?set AGENT_API_HOSTNAMES in deploy/.env}
      CONSOLE_ORIGIN: https://${CONSOLE_SITE:?set CONSOLE_SITE in deploy/.env}
      CONSOLE_SECRET_KEY: ${CONSOLE_SECRET_KEY:?set CONSOLE_SECRET_KEY in deploy/.env}
      # Believe only Caddy (its fixed address below) about the browser's address.
      CONSOLE_TRUST_PROXY: ${CADDY_IP:-172.30.57.10}
      # Fixed in the image: CONSOLE_HOST=0.0.0.0, CONSOLE_PORT=8080, AGENT_API_PORT=8443, DEV_PKI_DIR=/var/lib/cabinet/pki,
      # PACKAGE_DIR, RELEASE_DIR, CONSOLE_STATIC_DIR, AGENT_DOWNLOAD_DIR=/opt/cabinet/agent-download.
    ports:
      # Published directly, never behind a proxy: the agents' client certificates must reach Node.
      - "8443:8443"
    volumes:
      # DEMO ONLY: the development issuing CA (its private key is in this volume). Production uses a KMS-held key.
      - pki:/var/lib/cabinet/pki
      - packages:/var/lib/cabinet/packages
      - releases:/var/lib/cabinet/releases
    networks:
      - backend
      - frontend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    depends_on:
      - server
    environment:
      CONSOLE_SITE: ${CONSOLE_SITE}
      CONSOLE_TLS: ${CONSOLE_TLS:-internal}
      CONSOLE_ALLOW_FROM: ${CONSOLE_ALLOW_FROM:-0.0.0.0/0 ::/0}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      frontend:
        ipv4_address: ${CADDY_IP:-172.30.57.10}

networks:
  # SQL Server, the migrations and the server. internal: no route to or from the outside.
  backend:
    internal: true
  # The server and Caddy, with a fixed range so the server can trust Caddy's address alone.
  frontend:
    ipam:
      config:
        - subnet: ${FRONTEND_SUBNET:-172.30.57.0/24}

volumes:
  mssqldata:
  pki:
  packages:
  releases:
  caddy_data:
  caddy_config:
