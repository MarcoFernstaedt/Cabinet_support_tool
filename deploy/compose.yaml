# Demo deployment: Microsoft SQL Server 2022, the platform server (agent API + console API + console), and Caddy for the console's HTTPS.
# Secrets and names come from deploy/.env (made by setup.sh from .env.example; never committed).
#
#   docker compose up -d --build        start or update (the migrate service runs first, every time)
#   docker compose logs -f server       watch the server
#   docker compose down                 stop (data is kept in the volumes)
#
# Published ports: 80 and 443 (Caddy, the console) and 8443 (the agent API, mutual TLS, terminated by Node).
# SQL Server is never published; it sits on an internal network with no route out.
#
# This file is the generic deployment and holds nothing specific to one machine. Anything local - a tailnet,
# Tailscale Funnel, a front on another domain, a console under a path, development-only switches - goes in
# deploy/compose.override.yaml, which Docker Compose reads automatically next to this file and git ignores.
# A worked example for a tailnet and Funnel front is in deploy/examples/tailnet/.
#
# The demo link lands straight on the console's own sign-in page. The shared-code gate that used to sit in front
# of it is gone: deploy/Caddyfile is mounted instead of deploy/Caddyfile.gate, and the gate service is removed.
# Restore both, and recreate caddy, to put the code page back.

name: cabinet

x-platform-image: &platform-image
  image: cabinet-platform:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    args:
      # The path the console is served under. "/" serves it at the root of CONSOLE_SITE.
      CONSOLE_BASE: ${CONSOLE_BASE:-/}
      # Development only. When true, the agents this image builds accept releases signed by the release key without
      # an Authenticode publisher. Production pins a real publisher and leaves this false
      # (agent/src/Cabinet.Agent.Core/Cabinet.Agent.Core.csproj). Turn it on only in deploy/.env, knowingly.
      ALLOW_UNSIGNED_DEVELOPMENT_UPGRADES: ${ALLOW_UNSIGNED_DEVELOPMENT_UPGRADES:-false}

services:
  # Microsoft SQL Server 2022 for Linux. MSSQL_PID chooses the edition: Express is free (databases up to 10 GB, 1 GB of memory for the
  # engine) and carries a small deployment; Standard, Enterprise or Developer need a licence you hold. Accepting the EULA is your decision.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU27-GDR1-ubuntu-22.04@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    restart: unless-stopped
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:?set ACCEPT_EULA=Y in deploy/.env to accept the SQL Server licence terms}
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?set SQL_SA_PASSWORD in deploy/.env}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
    volumes:
      - mssqldata:/var/opt/mssql
    networks:
      - backend
    cap_drop: [ALL]
    # sqlservr carries cap_net_bind_service as a file capability, and execve refuses a
    # file-capability binary whose capability is outside the bounding set — cap_drop: ALL on its own
    # kills the container with exit 126 "Operation not permitted" before SQL Server ever starts.
    # Granting exactly that capability keeps cap_drop: ALL and no-new-privileges intact.
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # One shot: creates the database, applies the migrations as the database owner, then creates or updates the application's
  # least-privilege login (cabinet_app_login, a member of cabinet_app only). Safe to run again.
  migrate:
    <<: *platform-image
    restart: "no"
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      DATABASE_OWNER_URL: sqlserver://sa:${SQL_SA_PASSWORD}@mssql:1433/cabinet?trustServerCertificate=true
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/.env}
    command: ["sh", "-c", "node /opt/cabinet/deploy/database-setup.mjs create && node /opt/cabinet/server/dist/src/cli.js migrate && node /opt/cabinet/deploy/database-setup.mjs login"]
    networks:
      - backend
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  server:
    <<: *platform-image
    restart: unless-stopped
    depends_on:
      mssql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: sqlserver://cabinet_app_login:${APP_DB_PASSWORD}@mssql:1433/cabinet?trustServerCertificate=true
      # Every name or IP an agent may use to reach the agent API. The development TLS certificate covers exactly these.
      AGENT_API_HOSTNAMES: ${AGENT_API_HOSTNAMES:?set AGENT_API_HOSTNAMES in deploy/.env}
      # The console refuses every state-changing request whose Origin header is not exactly this value.
      CONSOLE_ORIGIN: ${CONSOLE_ORIGIN:-https://${CONSOLE_SITE}}
      CONSOLE_SECRET_KEY: ${CONSOLE_SECRET_KEY:?set CONSOLE_SECRET_KEY in deploy/.env}
      # Believe only Caddy (its fixed address below) about the browser's address.
      CONSOLE_TRUST_PROXY: ${CADDY_IP:-172.30.57.10}
      # Processes serving the agent port. 1 is enough for a few thousand cabinets; use 2 on a 4-core server from about 8,000
      # (docs/platform/performance.md). The heap is per process.
      AGENT_API_WORKERS: ${AGENT_API_WORKERS:-1}
      # Fixed in the image: CONSOLE_HOST=0.0.0.0, CONSOLE_PORT=8080, AGENT_API_PORT=8443, DEV_PKI_DIR=/var/lib/cabinet/pki,
      # PACKAGE_DIR, RELEASE_DIR, CONSOLE_STATIC_DIR, AGENT_DOWNLOAD_DIR=/opt/cabinet/agent-download.
    ports:
      # The agent API, published on every interface: cabinets on customer networks reach it over the internet.
      # Every route needs a client certificate this server issued, except /health and the two enrollment routes
      # (enrolling needs a bootstrap token). A caller without one still completes the TLS handshake, reaches those
      # three routes, and is refused on every other.
      # Agents' client certificates must reach Node directly, so this port never goes through Caddy.
      - "${AGENT_BIND_IP:-0.0.0.0}:8443:8443"
    volumes:
      # DEMO ONLY: the development issuing CA (its private key is in this volume). Production uses a KMS-held key.
      - pki:/var/lib/cabinet/pki
      - packages:/var/lib/cabinet/packages
      - releases:/var/lib/cabinet/releases
    networks:
      - backend
      - frontend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    depends_on:
      - server
    environment:
      CONSOLE_SITE: ${CONSOLE_SITE}
      CONSOLE_TLS: ${CONSOLE_TLS:-internal}
      CONSOLE_ALLOW_FROM: ${CONSOLE_ALLOW_FROM:-0.0.0.0/0 ::/0}
    ports:
      # The console's HTTPS front. CONSOLE_ALLOW_FROM (deploy/.env) limits who reaches it.
      - "${CONSOLE_BIND_IP:-0.0.0.0}:80:80"
      - "${CONSOLE_BIND_IP:-0.0.0.0}:443:443"
      - "${CONSOLE_BIND_IP:-0.0.0.0}:443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # The only container facing the internet: no capabilities beyond binding 80/443, read-only root, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks:
      frontend:
        ipv4_address: ${CADDY_IP:-172.30.57.10}

networks:
  # SQL Server, the migrations and the server. internal: no route to or from the outside.
  backend:
    internal: true
  # The server and Caddy, with a fixed range so the server can trust Caddy's address alone.
  frontend:
    ipam:
      config:
        - subnet: ${FRONTEND_SUBNET:-172.30.57.0/24}

# pgdata (the PostgreSQL 16 volume from before the SQL Server swap) is deliberately not declared here: nothing
# uses it, and an undeclared volume is left alone on disk instead of being pruned. Its data is unchanged.
volumes:
  mssqldata:
  pki:
  packages:
  releases:
  caddy_data:
  caddy_config:
