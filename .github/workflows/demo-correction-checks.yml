name: Demo correction checks
on:
  push:
  pull_request:

jobs:
  portable-and-shipping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python3 -B -m unittest discover -s tests/office-bootstrap -p 'test_*.py' -v
      - run: dotnet restore CabinetPlatform.sln
      - run: dotnet test tests/CabinetPlatform.Console.Core.Tests/CabinetPlatform.Console.Core.Tests.csproj -c Release --no-restore --filter 'FullyQualifiedName~ShellTests.The_approval_badge_is_empty_when_shipping_refuses_legacy_work|FullyQualifiedName~Staff|FullyQualifiedName~Session' -m:1
      - run: dotnet test tests/CabinetPlatform.Server.Tests/CabinetPlatform.Server.Tests.csproj -c Release --no-restore --filter 'FullyQualifiedName~DiagnosticModeTests|FullyQualifiedName~MonitoringBoundaryTests|FullyQualifiedName~Staff|FullyQualifiedName~Renewal' -m:1
  historical-maintenance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore tests/CabinetPlatform.Console.Core.Tests/CabinetPlatform.Console.Core.Tests.csproj -p:Configuration=LegacyMaintenanceTests
      - run: dotnet restore tests/CabinetPlatform.Server.Tests/CabinetPlatform.Server.Tests.csproj -p:Configuration=LegacyMaintenanceTests
      - run: dotnet test tests/CabinetPlatform.Console.Core.Tests/CabinetPlatform.Console.Core.Tests.csproj -c LegacyMaintenanceTests --no-restore --filter 'FullyQualifiedName~ShellTests.The_approval_badge_counts_only_what_this_user_can_act_on' -m:1
      - run: dotnet test tests/CabinetPlatform.Server.Tests/CabinetPlatform.Server.Tests.csproj -c LegacyMaintenanceTests --no-restore --filter 'FullyQualifiedName~DiagnosticModeTests' -m:1
      # This lane is test-only. Directory.Build.props also refuses every publish and pack target.
