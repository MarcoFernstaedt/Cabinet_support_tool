name: Platform contracts (spec rebuild)
on:
  push:
  pull_request:

jobs:
  contracts-server-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Contracts (schemas, examples, generated types)
        working-directory: contracts
        run: npm ci && npm test && npm run check-generated && npm audit --audit-level=low
      - name: Server builds and validates against the contracts
        working-directory: server
        run: npm ci && npm test && npm audit --audit-level=low
      - name: Agent C# types match the contracts
        run: dotnet test agent/Cabinet.Agent.sln -c Release -m:1
