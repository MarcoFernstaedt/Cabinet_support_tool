name: Platform contracts (spec rebuild)
on:
  push:
  pull_request:

jobs:
  contracts-server-agent:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:ci-only-not-a-secret@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Contracts (schemas, examples, generated types)
        working-directory: contracts
        run: npm ci && npm test && npm run check-generated && npm audit --audit-level=low
      - name: Agent builds (Windows projects compile here too)
        run: dotnet build agent/Cabinet.Agent.sln -c Release
      - name: Console builds (strict TypeScript)
        working-directory: console
        run: npm ci && npm run build && npm audit --audit-level=low
      - name: Server (database, audit chain, both APIs, a real agent end to end, and the console in a real browser)
        working-directory: server
        env:
          TEST_AGENT_DLL: ${{ github.workspace }}/agent/tests/Cabinet.Agent.TestAgent/bin/Release/net8.0/Cabinet.Agent.TestAgent.dll
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
          npm audit --audit-level=low
      - name: Agent contracts and core (validation, replay, rate limits, broker protocol)
        run: |
          dotnet test agent/tests/Cabinet.Agent.Contracts.Tests -c Release --no-build
          dotnet test agent/tests/Cabinet.Agent.Core.Tests -c Release --no-build

  agent-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build agent/Cabinet.Agent.sln -c Release
      - name: Core tests on Windows
        run: dotnet test agent/tests/Cabinet.Agent.Core.Tests -c Release --no-build
      - name: Prepare real package fixtures (a driver signed through Microsoft, tampered, impostor and unsigned copies, a Microsoft MSI)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $fx = Join-Path $env:RUNNER_TEMP 'package-fixtures'
          New-Item -ItemType Directory -Force $fx | Out-Null
          $chosen = $null
          $folders = Get-WindowsDriver -Online | Where-Object { $_.Driver -like 'oem*.inf' } | ForEach-Object { Split-Path $_.OriginalFileName } | Sort-Object -Unique
          foreach ($folder in $folders) {
            $cat = Get-ChildItem $folder -Filter *.cat -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $cat) { continue }
            $sig = Get-AuthenticodeSignature $cat.FullName
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notlike 'CN=Microsoft Windows Hardware Compatibility Publisher*') { continue }
            $size = (Get-ChildItem $folder -Recurse -File | Measure-Object Length -Sum).Sum
            if (-not $chosen -or $size -lt $chosen.Size) { $chosen = @{ Folder = $folder; Size = $size } }
          }
          if (-not $chosen) { throw 'No third-party driver signed through Microsoft is installed on this runner.' }
          Write-Host "Driver fixture: $($chosen.Folder) ($($chosen.Size) bytes)"
          Get-ChildItem $chosen.Folder -Recurse -File | Format-Table Name, Length
          Compress-Archive -Path (Join-Path $chosen.Folder '*') -DestinationPath "$fx\oem-driver.zip"
          # The same package with one byte changed in the middle of a driver binary.
          $t = Join-Path $env:RUNNER_TEMP 'tampered'
          Copy-Item $chosen.Folder $t -Recurse
          $bin = Get-ChildItem $t -Recurse -File | Where-Object { $_.Extension -in '.sys', '.dll' } | Sort-Object Length -Descending | Select-Object -First 1
          $bytes = [IO.File]::ReadAllBytes($bin.FullName); $mid = [int]($bytes.Length / 2); $bytes[$mid] = $bytes[$mid] -bxor 0xFF
          [IO.File]::WriteAllBytes($bin.FullName, $bytes)
          Compress-Archive -Path "$t\*" -DestinationPath "$fx\tampered-driver.zip"
          # A package whose catalog is unsigned, and the same signed by an impostor certificate carrying Microsoft's publisher name.
          $i = Join-Path $env:RUNNER_TEMP 'impostor'
          New-Item -ItemType Directory $i | Out-Null
          Set-Content "$i\impostor.inf" "[Version]`r`nSignature=`"`$WINDOWS NT`$`"`r`nClass=System`r`nCatalogFile=impostor.cat`r`n" -Encoding Ascii
          Copy-Item "$env:windir\System32\version.dll" "$i\impostor.dll"
          New-FileCatalog -Path $i -CatalogFilePath "$i\impostor.cat" -CatalogVersion 2.0 | Out-Null
          $u = Join-Path $env:RUNNER_TEMP 'unsigned'
          Copy-Item $i $u -Recurse
          Compress-Archive -Path "$u\*" -DestinationPath "$fx\unsigned-driver.zip"
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Microsoft Windows Hardware Compatibility Publisher, O=Microsoft Corporation' -CertStoreLocation Cert:\CurrentUser\My
          Set-AuthenticodeSignature -FilePath "$i\impostor.cat" -Certificate $cert -HashAlgorithm SHA256 | Format-List Status, StatusMessage
          Compress-Archive -Path "$i\*" -DestinationPath "$fx\impostor-driver.zip"
          # A Microsoft-signed MSI from the Windows Installer cache (checked only, never installed).
          $msi = Get-ChildItem "$env:windir\Installer\*.msi" -Force -ErrorAction SilentlyContinue | Sort-Object Length |
            Where-Object { $s = Get-AuthenticodeSignature $_.FullName; $s.Status -eq 'Valid' -and $s.SignerCertificate.Subject -like 'CN=Microsoft Corporation*' } | Select-Object -First 1
          if (-not $msi) { throw 'No Microsoft-signed MSI is cached on this runner.' }
          Write-Host "MSI fixture: $($msi.FullName) ($($msi.Length) bytes)"
          Copy-Item $msi.FullName "$fx\microsoft.msi"
          Get-ChildItem $fx | Format-Table Name, Length
          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGE_FIXTURES=$fx" -Encoding Ascii
      - name: Broker pipe access, every read operation, the write operations and real packages on Windows
        run: dotnet test agent/tests/Cabinet.Agent.Windows.Tests -c Release --no-build --logger "console;verbosity=normal"
      - name: Publish and install both services
        shell: pwsh
        run: |
          ./agent/install/Publish-CabinetAgent.ps1
          ./agent/install/Install-CabinetAgent.ps1 -EnableLocalHarness -SyncCabinetAddress 127.0.0.1 -AllowedTcpPort 135 -PlatformServerHost localhost -CabinetRole standalone
          Start-Sleep -Seconds 10
          Get-Content "$env:ProgramData\Mashura\CabinetAgent\logs\*.log"
      - name: Services run with the intended accounts
        shell: pwsh
        run: |
          $services = Get-CimInstance Win32_Service -Filter "Name='CabinetAgentBroker' OR Name='CabinetAgentNetwork'"
          $services | Format-Table Name, State, StartName
          if (($services | Where-Object Name -eq 'CabinetAgentBroker').StartName -ne 'LocalSystem') { throw 'The broker must run as LocalSystem.' }
          if (($services | Where-Object Name -eq 'CabinetAgentNetwork').StartName -ne 'NT SERVICE\CabinetAgentNetwork') { throw 'The network service must run as its virtual account.' }
          if (($services | Where-Object State -ne 'Running')) { throw 'Both services must be running.' }
          if (-not (Select-String -Path "$env:ProgramData\Mashura\CabinetAgent\logs\network.log" -Pattern 'The broker answers' -SimpleMatch -Quiet)) { throw 'The network service could not reach the broker.' }
      - name: Other accounts cannot reach the installed broker (this step runs as an administrator)
        shell: pwsh
        run: |
          & "$env:ProgramFiles\Mashura\CabinetAgent\Cabinet.Agent.Harness\cabinet-harness.exe" probe-broker
          if ($LASTEXITCODE -ne 0) { throw 'An administrator account could open the broker pipe.' }
      - name: Every read operation through the installed services and the real pipe
        shell: pwsh
        run: |
          $harness = "$env:ProgramFiles\Mashura\CabinetAgent\Cabinet.Agent.Harness\cabinet-harness.exe"
          $config = "$env:ProgramData\Mashura\CabinetAgent\agent-config.json"
          & $harness sample --config $config --out "$env:RUNNER_TEMP\commands.json"
          & $harness drop --commands "$env:RUNNER_TEMP\commands.json" --out "$env:RUNNER_TEMP\results.json"
          $commands = Get-Content "$env:RUNNER_TEMP\commands.json" | ConvertFrom-Json
          $results = Get-Content "$env:RUNNER_TEMP\results.json" | ConvertFrom-Json
          $failed = @()
          for ($i = 0; $i -lt $commands.Count; $i++) {
            $op = $commands[$i].operation; $r = $results[$i].result
            Write-Host ("{0,-20} {1,-10} {2} {3}" -f $op, $r.status, $r.error.code, $r.error.message)
            # The sample asks eventlog.get for record 1, which is usually overwritten; a real record is fetched below.
            if ($r.status -ne 'succeeded' -and -not ($op -eq 'eventlog.get' -and $r.error.code -eq 'not_found')) { $failed += $op }
          }
          $newest = ($results | Where-Object { $_.result.output.log -eq 'System' -and $_.result.output.entries } | Select-Object -First 1).result.output.entries[0].recordId
          & $harness make --config $config --operation eventlog.get --params "{`"log`":`"System`",`"recordId`":$newest}" --out "$env:RUNNER_TEMP\get.json"
          & $harness drop --commands "$env:RUNNER_TEMP\get.json" --out "$env:RUNNER_TEMP\get-result.json"
          $get = (Get-Content "$env:RUNNER_TEMP\get-result.json" | ConvertFrom-Json)[0].result
          Write-Host ("eventlog.get #{0}: {1} ({2} event data fields)" -f $newest, $get.status, $get.output.eventData.Count)
          if ($get.status -ne 'succeeded') { $failed += 'eventlog.get' }
          Get-Content "$env:ProgramData\Mashura\CabinetAgent\logs\network.log" -Tail 40
          if ($failed) { throw "Did not succeed through the services: $($failed -join ', ')" }
      - name: The same commands again are refused as replays
        shell: pwsh
        run: |
          $harness = "$env:ProgramFiles\Mashura\CabinetAgent\Cabinet.Agent.Harness\cabinet-harness.exe"
          & $harness drop --commands "$env:RUNNER_TEMP\commands.json" --out "$env:RUNNER_TEMP\replayed.json"
          $results = Get-Content "$env:RUNNER_TEMP\replayed.json" | ConvertFrom-Json
          $codes = $results | ForEach-Object { $_.result.error.code } | Sort-Object -Unique
          Write-Host "Result codes on resend: $codes"
          if (@($codes).Count -ne 1 -or $codes -ne 'replayed') { throw "Expected every command to be refused as replayed, got: $codes" }
          # The harness exits 1 because nothing succeeded, which is the expected outcome here.
          exit 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Platform server, enrollment, commands and revocation end to end
        # One step: the Windows runner ends processes a step started when that step finishes, server included.
        shell: pwsh
        run: |
          $pg = Get-Service -Name postgresql*
          # The runner ships PostgreSQL disabled; it must be enabled before it can start.
          Set-Service -InputObject $pg -StartupType Automatic -Status Running
          for ($i = 0; $i -lt 30; $i++) { & (Join-Path $env:PGBIN 'pg_isready.exe') -h localhost; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep 1 }
          $psql = Join-Path $env:PGBIN 'psql.exe'
          $env:PGPASSWORD = 'root'
          & $psql -U postgres -c 'CREATE DATABASE cabinet'
          Push-Location contracts; npm ci; Pop-Location
          Push-Location server; npm ci; npm run build; Pop-Location
          $env:DATABASE_OWNER_URL = 'postgres://postgres:root@localhost:5432/cabinet'
          node server/dist/src/cli.js migrate
          & $psql -U postgres -d cabinet -c "CREATE ROLE cabinet_app_ci LOGIN PASSWORD 'ci-only-not-a-secret'; GRANT cabinet_app TO cabinet_app_ci;"
          "DATABASE_URL=postgres://cabinet_app_ci:ci-only-not-a-secret@localhost:5432/cabinet" | Out-File -Append $env:GITHUB_ENV
          "DEV_PKI_DIR=$env:RUNNER_TEMP\dev-pki" | Out-File -Append $env:GITHUB_ENV
          $env:DATABASE_URL = 'postgres://cabinet_app_ci:ci-only-not-a-secret@localhost:5432/cabinet'
          $env:DEV_PKI_DIR = "$env:RUNNER_TEMP\dev-pki"
          $env:AGENT_API_PORT = '8443'
          $env:AGENT_API_HOSTNAMES = 'localhost'
          Start-Process -FilePath node -ArgumentList 'server/dist/src/main.js' -RedirectStandardOutput "$env:RUNNER_TEMP\server.log" -RedirectStandardError "$env:RUNNER_TEMP\server.err" -NoNewWindow
          for ($i = 0; $i -lt 30 -and -not (Test-Path "$env:DEV_PKI_DIR\dev-agent-api.cert.pem"); $i++) { Start-Sleep 1 }
          Start-Sleep 2
          node server/dist/src/cli.js user add --username ci.admin --name "CI Admin" --role admin
          $token = (node server/dist/src/cli.js token create --as ci.admin | Select-Object -Last 1).Trim()
          ./agent/install/Install-CabinetAgent.ps1 -EnableLocalHarness -SyncCabinetAddress 127.0.0.1 -AllowedTcpPort 135 -PlatformServerHost localhost -PlatformServerPort 8443 `
            -PlatformCaFile "$env:DEV_PKI_DIR\dev-issuing-ca.cert.pem" -BootstrapToken $token
          $request = $null
          for ($i = 0; $i -lt 60 -and -not $request; $i++) { Start-Sleep 2; $request = (node server/dist/src/cli.js pending | Select-Object -First 1) }
          Get-Content "$env:ProgramData\Mashura\CabinetAgent\logs\network.log" -Tail 20
          if (-not $request) { Get-Content "$env:RUNNER_TEMP\server.log" -Tail 30; throw 'No enrollment request arrived.' }
          if (Test-Path "$env:ProgramData\Mashura\CabinetAgent\state\bootstrap-token") { throw 'The bootstrap token was not deleted after use.' }
          node server/dist/src/cli.js approve ($request -split ' ')[0] --as ci.admin --client "CI Client" --site "Runner" --cabinet "Windows runner" --role standalone
          $online = $null
          for ($i = 0; $i -lt 60 -and -not $online; $i++) { Start-Sleep 2; $online = node server/dist/src/cli.js cabinets | Select-String ' online ' }
          node server/dist/src/cli.js cabinets
          Get-Content "$env:ProgramData\Mashura\CabinetAgent\logs\network.log" -Tail 20
          if (-not $online) { throw 'The cabinet did not come online.' }
          $env:CABINET_ID = (($online.Line) -split ' ')[0]
          $ids = @{}
          foreach ($op in @(
              @('system.info', '{}'), @('peripheral.status', '{}'), @('disk.smart', '{}'), @('updates.status', '{}'),
              @('eventlog.query', '{"log":"System","levels":["error","warning"],"pageSize":5}'),
              @('network.test', '{"target":"sync_cabinet","method":"tcp","port":135}'))) {
            $ids[$op[0]] = (node server/dist/src/cli.js issue $env:CABINET_ID $op[0] $op[1] --as ci.admin | Select-Object -Last 1).Trim()
          }
          $failed = @()
          foreach ($op in $ids.Keys) {
            $record = $null
            for ($i = 0; $i -lt 60; $i++) {
              $record = node server/dist/src/cli.js command $ids[$op] | Out-String | ConvertFrom-Json
              if ($record.status -notin @('queued', 'delivered')) { break }
              Start-Sleep 2
            }
            Write-Host ("{0,-20} {1} {2}" -f $op, $record.status, $record.result.error.code)
            if ($record.status -ne 'succeeded') { $failed += $op }
          }
          if ($failed) { Get-Content "$env:ProgramData\Mashura\CabinetAgent\logs\network.log" -Tail 30; throw "Did not succeed through the server: $($failed -join ', ')" }

          # ---- Milestone 5: writes, the safety net, firewall timers and packages, on real Windows through the installed services ----
          function Wait-Command($id, $seconds = 180) {
            for ($i = 0; $i -lt $seconds / 2; $i++) {
              $r = node server/dist/src/cli.js command $id | Out-String | ConvertFrom-Json
              if ($r.status -notin @('queued', 'delivered')) { return $r }
              Start-Sleep 2
            }
            return $r
          }
          function Expect($r, $status, $code) {
            Write-Host ("  -> {0} {1} {2}" -f $r.status, $r.result.error.code, $r.result.error.message)
            if ($r.status -ne $status -or ($code -and $r.result.error.code -ne $code)) {
              Get-Content "$env:ProgramData\Mashura\CabinetAgent\logs\broker.log" -Tail 30; Get-Content "$env:ProgramData\Mashura\CabinetAgent\logs\network.log" -Tail 30
              throw "Expected $status $code"
            }
          }
          $cli = 'server/dist/src/cli.js'
          node $cli user add --username ci.tier2 --name "CI Tier 2" --role tier2 | Out-Null
          node $cli user add --username ci.admin2 --name "CI Second Admin" --role admin | Out-Null
          $sql = { param($q) (& $psql -U postgres -d cabinet -tAc $q).Trim() }

          Write-Host 'The server checks real files: a driver signed through Microsoft and a Microsoft MSI pass; tampered, impostor and unsigned ones are refused.'
          foreach ($f in @(@('oem-driver.zip', 'driver', 'accepted'), @('microsoft.msi', 'msi', 'accepted'), @('tampered-driver.zip', 'driver', 'refused  signature_invalid'),
                           @('impostor-driver.zip', 'driver', 'refused  publisher_not_trusted'), @('unsigned-driver.zip', 'driver', 'refused  signature_invalid'))) {
            $out = node $cli package verify "$env:PACKAGE_FIXTURES\$($f[0])" --type $f[1]
            Write-Host "  $($f[0]): $out"
            if (-not "$out".StartsWith($f[2])) { throw "The server's check of $($f[0]) should give '$($f[2])'." }
          }

          $firewallAlerts = (& $sql "SELECT count(*) FROM alerts a JOIN issue_types t ON t.id = a.issue_type_id WHERE t.key = 'firewall'")
          Write-Host 'A firewall rule through the platform: created, kept because the result was delivered, attributed to its command, then deleted.'
          $id = (node $cli issue $env:CABINET_ID firewall.setRule '{"change":"create","rule":{"name":"MashuraDiag CI 9","direction":"out","action":"block","protocol":"tcp","remotePorts":[{"from":9,"to":9}],"remoteAddresses":["203.0.113.9"],"profiles":["domain","private","public"],"enabled":true}}' --as ci.tier2 --write | Select-Object -Last 1).Trim()
          Expect (Wait-Command $id) 'succeeded'
          if (-not (Get-NetFirewallRule -DisplayName 'MashuraDiag CI 9' -ErrorAction SilentlyContinue)) { throw 'The rule is not in Windows Firewall.' }
          for ($i = 0; $i -lt 45 -and (& $sql "SELECT count(*) FROM firewall_changes WHERE command_id = '$id' AND event_id IS NOT NULL") -ne '1'; $i++) { Start-Sleep 2 }
          if ((& $sql "SELECT count(*) FROM firewall_changes WHERE command_id = '$id' AND event_id IS NOT NULL") -ne '1') { throw 'The change was not attributed to its command.' }
          if ((& $sql "SELECT count(*) FROM alerts a JOIN issue_types t ON t.id = a.issue_type_id WHERE t.key = 'firewall'") -ne $firewallAlerts) { throw 'A platform change raised an unexpected-change alert.' }
          Start-Sleep 125
          if (-not (Get-NetFirewallRule -DisplayName 'MashuraDiag CI 9' -ErrorAction SilentlyContinue)) { throw 'The confirmed rule was rolled back.' }
          Expect (Wait-Command (node $cli issue $env:CABINET_ID firewall.setRule '{"change":"delete","ruleName":"MashuraDiag CI 9"}' --as ci.tier2 --write | Select-Object -Last 1).Trim()) 'succeeded'
          if (Get-NetFirewallRule -DisplayName 'MashuraDiag CI 9' -ErrorAction SilentlyContinue) { throw 'The rule was not deleted.' }

          Write-Host 'Network writes that change nothing on this runner: DHCP on a DHCP adapter, automatic DNS on an automatic adapter.'
          $nic = Get-NetIPConfiguration | Where-Object { $_.IPv4DefaultGateway } | Select-Object -First 1
          Expect (Wait-Command (node $cli issue $env:CABINET_ID network.setIp "{`"interfaceIndex`":$($nic.InterfaceIndex),`"mode`":`"dhcp`"}" --as ci.tier2 --write | Select-Object -Last 1).Trim()) 'succeeded'
          Expect (Wait-Command (node $cli issue $env:CABINET_ID network.setDns "{`"interfaceIndex`":$($nic.InterfaceIndex),`"mode`":`"automatic`"}" --as ci.tier2 --write | Select-Object -Last 1).Trim()) 'succeeded'

          Write-Host 'A bad change nobody confirms is undone: a firewall rule and a DNS change sent through the local harness (no server confirms them).'
          $harness = "$env:ProgramFiles\Mashura\CabinetAgent\Cabinet.Agent.Harness\cabinet-harness.exe"
          $config = "$env:ProgramData\Mashura\CabinetAgent\agent-config.json"
          $servers = ($nic.DNSServer | Where-Object AddressFamily -eq 2).ServerAddresses | Select-Object -First 4
          & $harness make --config $config --operation firewall.setRule --params '{"change":"create","rule":{"name":"MashuraDiag CI unconfirmed","direction":"out","action":"block","protocol":"tcp","remotePorts":[{"from":7,"to":7}],"profiles":["domain","private","public"],"enabled":true}}' --out "$env:RUNNER_TEMP\unconfirmed-rule.json"
          & $harness drop --commands "$env:RUNNER_TEMP\unconfirmed-rule.json" --out "$env:RUNNER_TEMP\unconfirmed-rule-result.json"
          $dnsParams = @{ interfaceIndex = $nic.InterfaceIndex; mode = 'static'; servers = @($servers) } | ConvertTo-Json -Compress
          & $harness make --config $config --operation network.setDns --params $dnsParams --out "$env:RUNNER_TEMP\unconfirmed-dns.json"
          & $harness drop --commands "$env:RUNNER_TEMP\unconfirmed-dns.json" --out "$env:RUNNER_TEMP\unconfirmed-dns-result.json"
          Get-Content "$env:RUNNER_TEMP\unconfirmed-rule-result.json", "$env:RUNNER_TEMP\unconfirmed-dns-result.json"
          if (-not (Get-NetFirewallRule -DisplayName 'MashuraDiag CI unconfirmed' -ErrorAction SilentlyContinue)) { throw 'The unconfirmed rule was not created.' }
          $key = "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces\$((Get-NetAdapter -InterfaceIndex $nic.InterfaceIndex).InterfaceGuid)"
          if (-not (Get-ItemProperty $key).NameServer) { throw 'The unconfirmed DNS change was not made.' }

          Write-Host 'A firewall profile turned off for one minute comes back on, even though the broker restarts in between (a reboot keeps the timer the same way).'
          Expect (Wait-Command (node $cli issue $env:CABINET_ID firewall.setProfile '{"profile":"public","enabled":false,"defaultInbound":"block","defaultOutbound":"allow","durationMinutes":1}' --as ci.tier2 --write | Select-Object -Last 1).Trim()) 'succeeded'
          if ((Get-NetFirewallProfile -Name Public).Enabled) { throw 'The public profile was not turned off.' }
          Stop-Service CabinetAgentBroker -Force; Start-Sleep 20; Start-Service CabinetAgentBroker; Start-Service CabinetAgentNetwork
          Start-Sleep 140
          if (-not (Get-NetFirewallProfile -Name Public).Enabled) { Get-Content "$env:ProgramData\Mashura\CabinetAgent\logs\broker.log" -Tail 30; throw 'The public profile did not come back on.' }
          if (Get-NetFirewallRule -DisplayName 'MashuraDiag CI unconfirmed' -ErrorAction SilentlyContinue) { throw 'The unconfirmed rule was not rolled back.' }
          if ((Get-ItemProperty $key).NameServer) { throw 'The unconfirmed DNS change was not rolled back.' }
          Select-String -Path "$env:ProgramData\Mashura\CabinetAgent\logs\broker.log" -Pattern 'rolled back', 'on again' -SimpleMatch | ForEach-Object { Write-Host "  $($_.Line)" }

          Write-Host 'Packages: the driver signed through Microsoft is uploaded, approved by a second Admin, downloaded, checked again and installed by pnputil.'
          $up = node $cli package upload "$env:PACKAGE_FIXTURES\oem-driver.zip" --type driver --name "CI driver" --version 1 --vendor Microsoft --as ci.admin
          Write-Host "  $up"
          $pkg = ($up -split '\s+')[0]; $sha = ($up -split 'sha256 ')[1].Trim()
          node $cli package approve $pkg --as ci.admin2
          $r = Wait-Command (node $cli issue $env:CABINET_ID package.install "{`"packageId`":`"$pkg`",`"packageType`":`"driver`",`"sha256`":`"$sha`"}" --as ci.tier2 --write | Select-Object -Last 1).Trim() 600
          Expect $r 'succeeded'
          Write-Host "  installed: $($r.result.output.installed) signer: $($r.result.output.signer) exit $($r.result.output.exitCode)"
          if ($r.result.output.signer -ne 'Microsoft Windows Hardware Compatibility Publisher') { throw 'Unexpected signer.' }
          Write-Host 'The server refuses the tampered, impostor and unsigned packages on upload...'
          foreach ($bad in @('tampered-driver.zip', 'impostor-driver.zip', 'unsigned-driver.zip')) {
            node $cli package upload "$env:PACKAGE_FIXTURES\$bad" --type driver --name "CI $bad" --version 1 --vendor x --as ci.admin
            if ($LASTEXITCODE -eq 0) { throw "The server accepted $bad." }
          }
          Write-Host '...and when they are forced past the server (approved by hand in the database), the agent refuses each itself.'
          $data = (Resolve-Path 'data/packages').Path
          foreach ($bad in @(@('tampered-driver.zip', 'signature_invalid'), @('impostor-driver.zip', 'publisher_not_trusted'), @('unsigned-driver.zip', 'signature_invalid'))) {
            $hash = (Get-FileHash "$env:PACKAGE_FIXTURES\$($bad[0])" -Algorithm SHA256).Hash.ToLower()
            Copy-Item "$env:PACKAGE_FIXTURES\$($bad[0])" "$data\$hash.pkg" -Force
            $forced = [guid]::NewGuid().ToString()
            & $psql -U postgres -d cabinet -c "INSERT INTO packages (id, name, version, vendor, type, state, sha256, size_bytes, signer, uploaded_by, approved_by, approved_at) SELECT '$forced', 'Forced $($bad[0])', '1', 'x', 'driver', 'approved', '$hash', 1, 'forced', a.id, b.id, now() FROM users a, users b WHERE a.username = 'ci.admin' AND b.username = 'ci.admin2'" | Out-Null
            Write-Host "  $($bad[0])"
            Expect (Wait-Command (node $cli issue $env:CABINET_ID package.install "{`"packageId`":`"$forced`",`"packageType`":`"driver`",`"sha256`":`"$hash`"}" --as ci.tier2 --write | Select-Object -Last 1).Trim()) 'rejected' $bad[1]
          }
          if (Get-ChildItem "$env:ProgramData\Mashura\CabinetAgent\staging" -Force) { throw 'The staging folder was not emptied.' }
          Write-Host 'driver.uninstall reaches pnputil (a published name that does not exist is reported, nothing is removed).'
          Expect (Wait-Command (node $cli issue $env:CABINET_ID driver.uninstall '{"publishedName":"oem9999.inf"}' --as ci.tier2 --write | Select-Object -Last 1).Trim()) 'failed' 'not_found'
          # Every write command the server sent has its command.write entry, by the person who issued it (the harness's local writes never touch the server).
          $writes = & $sql "SELECT count(*) FROM commands WHERE operation IN ('network.setIp','network.setDns','firewall.setProfile','firewall.setRule','firewall.restore','package.install','driver.uninstall')"
          $missing = & $sql "SELECT count(*) FROM commands c WHERE c.operation IN ('network.setIp','network.setDns','firewall.setProfile','firewall.setRule','firewall.restore','package.install','driver.uninstall') AND NOT EXISTS (SELECT 1 FROM audit_log a WHERE a.action = 'command.write' AND a.details->>'commandId' = c.id::text AND a.actor_id = c.issued_by::text)"
          Write-Host "Write commands: $writes; without their audit entry: $missing"
          if ([int]$writes -lt 10 -or [int]$missing -ne 0) { throw 'Not every write is in the audit log.' }

          node server/dist/src/cli.js revoke $env:CABINET_ID --as ci.admin
          $refused = $false
          for ($i = 0; $i -lt 45 -and -not $refused; $i++) {
            Start-Sleep 2
            $refused = Select-String -Path "$env:ProgramData\Mashura\CabinetAgent\logs\network.log" -Pattern 'refused this cabinet' -SimpleMatch -Quiet
          }
          if (-not $refused) { Get-Content "$env:ProgramData\Mashura\CabinetAgent\logs\network.log" -Tail 20; throw 'The revoked cabinet was not refused.' }
          node server/dist/src/cli.js audit-verify
          if ($LASTEXITCODE -ne 0) { throw 'The audit chain is broken.' }
          exit 0
      - name: Uninstall
        if: always()
        shell: pwsh
        run: ./agent/install/Uninstall-CabinetAgent.ps1 -RemoveData
